name: askmydocs-qdrant-sandbox

services:
  qdrant:
    image: qdrant/qdrant:v1.18.2
    container_name: askmydocs-qdrant-sandbox
    restart: unless-stopped
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage

volumes:
  qdrant_storage:
    name: askmydocs_qdrant_sandbox_data
